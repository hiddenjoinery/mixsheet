[project]
name = "mixsheet"
version = "0.1.0"
description = "The Mix Sheet — material calculator for concrete and UHPC mixes (CLI)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Hidden Joinery" }]

dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.13",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.scripts]
mixsheet = "mixsheet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mixsheet"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.409",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "S",           # flake8-bandit
    "PTH",         # flake8-use-pathlib
    "TRY",         # tryceratops
    "RUF",         # ruff-specific
    "D",           # pydocstyle
    "ANN",         # flake8-annotations
    "ASYNC",       # flake8-async
    "A",           # flake8-builtins
    "ISC",         # implicit-str-concat
    "PIE",         # misc lints
    "T20",         # no print
    "PT",          # pytest style
    "RET",         # return
    "TID",         # tidy imports
    "TC",          # type-checking imports
    "ARG",         # unused args
    "ERA",         # eradicate commented code
    "PL",          # pylint
    "PERF",        # perflint
]
ignore = [
    "D203",        # conflicts with D211
    "D213",        # conflicts with D212
    "COM812",      # formatter compatibility
    "ISC001",      # formatter compatibility
    "ANN401",      # Any is sometimes required (e.g. **kwargs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "D", "PLR2004", "ARG001", "ARG002", "PLC0415", "TC"]
"**/__init__.py" = ["D104"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external resources",
]

[tool.coverage.run]
branch = true
source = ["src/mixsheet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
